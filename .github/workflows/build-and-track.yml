name: build-and-track

# Daily: check for a new upstream HAOS release; if found, build our unified
# tri-vendor GPU/AI image and publish it as a GitHub Release. Also runnable on
# demand (optionally forcing a build of a specific tag).
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily
  workflow_dispatch:
    inputs:
      force_tag:
        description: "Build this upstream tag even if we already released it"
        required: false
        default: ""
      profile:
        description: "Build profile: all | nvidia-amd (no Xe) | intel-amd (in-tree only, no NVIDIA - pipeline proof)"
        required: false
        default: "all"

permissions:
  contents: write   # create releases + tags

env:
  UPSTREAM_REPO: home-assistant/operating-system
  # Only AUTO-build tags on this upstream line. A major bump changes the kernel
  # and invalidates the NVIDIA driver pairing and the version-sensitive patches
  # (GSP path, rauc.sh call sites, create-data-partition, daemon.json), so it
  # must be a deliberate, re-validated bump run manually with force_tag - never
  # an unattended cron build. Set to "" to track any release.
  #
  # Now tracking the 18.x line (kernel 6.18.52, HAOS 18.3). The 17.x -> 18.x bump
  # was validated: HAOS renamed hassos_* -> haos_* (the rauc compatible function,
  # BR2_EXTERNAL_*_PATH, and the data/supervisor units) - build.sh and the
  # seed-local-addons unit now match both names. Driver 595.84 still covers the
  # 6.18 kernel. The next guarded boundary is 18.x -> 19.x.
  TRACK_LINE: "18."
  # Pin the HAOS builder image, OR leave blank to build it from the submodule's
  # own Dockerfile (guaranteed to match the pinned Buildroot toolchain).
  # Confirm the current published tag from the upstream repo's CI if you pin.
  BUILDER_IMAGE: ""
  OTA_COMPATIBLE: haos-generic-x86-64-gpu-ai

jobs:
  # ---------------------------------------------------------------------------
  # 1. Decide whether there is new upstream work to build.
  # ---------------------------------------------------------------------------
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Resolve latest upstream tag vs our latest release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          force="${{ github.event.inputs.force_tag }}"

          if [ -n "$force" ]; then
            up="$force"
          else
            up="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
              | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)"
          fi
          echo "upstream tag: ${up:-<none>}"
          [ -n "$up" ] || { echo "could not resolve upstream tag"; exit 1; }

          # Major-line guard: never auto-build across a kernel-changing bump.
          if [ -z "$force" ] && [ -n "${TRACK_LINE:-}" ] && [ "${up#$TRACK_LINE}" = "$up" ]; then
            echo "::notice::upstream ${up} is outside the tracked ${TRACK_LINE}x line - not auto-building."
            echo "  A major bump changes the kernel and needs the NVIDIA driver pin +"
            echo "  version-sensitive patches re-validated. When ready, run this workflow"
            echo "  manually with force_tag=${up}."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "version=${up}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Our latest release tag (empty if none yet).
          ours="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | sed -n 's/.*"tag_name":[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)"
          echo "our latest release: ${ours:-<none>}"

          if [ -n "$force" ] || [ "$up" != "$ours" ]; then
            echo "should_build=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${up}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build the unified image + RAUC bundle and publish the release.
  # ---------------------------------------------------------------------------
  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest   # NOTE: a full HAOS build is disk/time heavy; a
                             # larger or self-hosted runner is strongly advised.
    timeout-minutes: 350
    env:
      VERSION: ${{ needs.check-upstream.outputs.version }}
      # inputs.profile is empty on the cron schedule -> default to the full image
      PROFILE: ${{ github.event.inputs.profile || 'all' }}
    steps:
      - name: Free up runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h

      - name: Checkout (with our tree)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise upstream submodule at the target tag
        run: |
          set -euo pipefail
          git submodule sync --recursive

          # ORDER MATTERS (this bit them once, see below).
          # 1. Init the submodule FIRST, at its pinned gitlink. Until upstream/
          #    contains a .git, `git -C upstream ...` walks UP and silently
          #    operates on the PARENT repo - so fetching refs/tags/<VERSION>
          #    asked *our* repo for a HAOS tag and died with
          #    "fatal: couldn't find remote ref refs/tags/<VERSION>".
          git submodule update --init --depth 1 upstream

          # 2. NOW fetch the target tag into the submodule. A --depth 1 submodule
          #    clone carries no tags, which is why a later checkout failed with
          #    "error: pathspec 'tags/<VERSION>' did not match any file(s)".
          git -C upstream fetch --depth 1 origin \
            "refs/tags/${VERSION}:refs/tags/${VERSION}"
          git -C upstream checkout "tags/${VERSION}"
          git -C upstream describe --tags || true

          # 3. Buildroot is a nested submodule; init it AFTER the checkout so we
          #    get the buildroot commit that THIS HAOS tag pins, not the old one.
          git -C upstream submodule update --init --recursive --depth 1

      - name: Preflight gate (kernel<->driver + assets) - hard fail
        run: |
          set -euo pipefail
          chmod +x external/scripts/preflight-check.sh
          STRICT=1 ./external/scripts/preflight-check.sh "${PROFILE}"

      - name: Write RAUC signing material from secrets
        env:
          RAUC_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
          RAUC_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output
          # HAOS's rauc.sh looks for cert.pem/key.pem in the build dir. The exact
          # location differs by HAOS version (repo root vs. output root), so we
          # place them in BOTH to be safe. Confirm against
          # upstream/buildroot-external/scripts/rauc.sh for your pin.
          printf '%s' "$RAUC_CERT" | tee cert.pem output/cert.pem >/dev/null
          printf '%s' "$RAUC_KEY"  | tee key.pem  output/key.pem  >/dev/null
          chmod 600 key.pem output/key.pem

      - name: Determine builder image
        id: builder
        run: |
          set -euo pipefail
          if [ -n "${BUILDER_IMAGE}" ]; then
            echo "image=${BUILDER_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            # Build the HAOS builder from the submodule's Dockerfile, with two
            # transforms that only bite on OLD release tags; current trixie-based
            # tags pass through untouched.
            #
            #  (1) STRIP the `# Docker` block. It installs docker-ce (+ apt deps
            #      software-properties-common -> python-apt) purely for a dind image
            #      preload that build.sh already no-ops. On 17.x (FROM debian:bullseye)
            #      its aging pool 404s on the pinned python-apt, killing `docker build`
            #      before the toolchain layer. We never need docker in the builder.
            #
            #  (2) If the base is debian:bullseye, REPOINT apt at archive.debian.org.
            #      bullseye is EOL: deb.debian.org still serves the base `main` index
            #      but the security pool (debian-security/pool/updates/...) is pruned,
            #      so the `# Build tools` apt-get 404s on libxml2/qemu-utils/sudo/vim/
            #      python3-pil/... archive.debian.org carries EOL bullseye + its final
            #      security pool; its Release files are expired, so also turn off
            #      Check-Valid-Until. Injected as a RUN right after FROM, before any
            #      apt-get. Idempotent (re-derived from the pristine submodule each run).
            echo "Building HAOS builder from submodule Dockerfile (docker-ce block stripped)"
            awk '/^# Docker$/{skip=1; next} skip && /^# Build tools$/{skip=0} !skip' \
              upstream/Dockerfile > upstream/Dockerfile.nodind
            if grep -qE '^FROM[[:space:]]+debian:bullseye' upstream/Dockerfile.nodind; then
              echo "bullseye base detected -> pinning apt to archive.debian.org (EOL)"
              # Single-quoted so the sed/printf quoting inside the RUN is literal; spliced
              # via a file (not awk -v, which would eat the \. \" \n escapes).
              FIX='RUN sed -i -E "s#https?://(deb|security)\.debian\.org/debian-security#http://archive.debian.org/debian-security#g; s#https?://(deb|security)\.debian\.org/debian#http://archive.debian.org/debian#g; /bullseye-updates/d" /etc/apt/sources.list && printf "Acquire::Check-Valid-Until \"false\";\nAcquire::Retries \"3\";\n" > /etc/apt/apt.conf.d/99archive'
              printf '%s\n' "$FIX" > "${RUNNER_TEMP:-/tmp}/aptfix.line"
              awk 'NR==FNR{fix=fix $0 ORS; next} {print} /^FROM[[:space:]]+debian:bullseye/ && !d{printf "%s", fix; d=1}' \
                "${RUNNER_TEMP:-/tmp}/aptfix.line" upstream/Dockerfile.nodind > upstream/Dockerfile.nodind.new
              mv upstream/Dockerfile.nodind.new upstream/Dockerfile.nodind
              echo "--- effective builder Dockerfile (head) ---"; sed -n '1,8p' upstream/Dockerfile.nodind
            fi
            docker build -t haos-gpu-builder:local -f upstream/Dockerfile.nodind upstream
            echo "image=haos-gpu-builder:local" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unified GPU/AI image + bundle
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e ota_compatible="${OTA_COMPATIBLE}" \
            -e PROFILE="${PROFILE}" \
            "${{ steps.builder.outputs.image }}" \
            bash -c "set -euo pipefail; ./external/scripts/build.sh"

      - name: Verify GPU artifacts are present
        run: |
          set -euo pipefail
          TGT=output/target
          IMG=output/images
          echo "checking kernel modules baked into the rootfs..."
          for ko in nvidia nvidia-uvm nvidia-modeset amdgpu i915; do
            if ! find "$TGT/lib/modules" -name "${ko}.ko*" | grep -q .; then
              echo "::error::missing kernel module ${ko}.ko"; exit 1
            fi
            echo "  ok: ${ko}.ko"
          done
          test -x "$TGT/usr/bin/nvidia-container-runtime" \
            || echo "::warning::nvidia-container-runtime hook not found"
          ls "$IMG"/*.raucb >/dev/null 2>&1 \
            || { echo "::error::no .raucb produced"; exit 1; }
          echo "artifacts:"; ls -lh "$IMG"

      - name: Stage release assets
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release
          IMG=output/images
          cp "$IMG"/*.raucb release/ 2>/dev/null || true
          # HAOS packs the raw disk image as .img.xz (name varies by board/ver).
          cp "$IMG"/*.img.xz release/ 2>/dev/null || \
          cp "$IMG"/haos_*.img.xz release/ 2>/dev/null || true
          # Rewrite the OTA manifest placeholders and ship it too.
          sed "s/__VERSION__/${VERSION}/g" ota/version-gpu-ai.json > release/version-gpu-ai.json
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "HAOS GPU-AI Universal ${{ env.VERSION }}"
          body: |
            Unified tri-vendor (NVIDIA / Intel / AMD) GPU-AI HAOS build tracking
            upstream `${{ env.UPSTREAM_REPO }}` tag `${{ env.VERSION }}`.

            RAUC compatible: `${{ env.OTA_COMPATIBLE }}` (stock bundles rejected).
            Install OTA on-device via the decoupled updater, or `rauc install`
            the `.raucb` directly.
          files: |
            release/*.raucb
            release/*.img.xz
            release/version-gpu-ai.json
          fail_on_unmatched_files: false
